name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @gratise/i18n pack --dry-run
      - run: pnpm --filter @gratise/example-ssr example
      - id: changesets
        name: Check for release changesets
        shell: bash
        run: |
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply versions and publish
        if: steps.changesets.outputs.present == 'true'
        shell: bash
        env:
          HUSKY: 0
          NPM_CONFIG_PROVENANCE: true
        run: |
          pnpm changeset version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changeset packages/i18n/package.json packages/i18n/CHANGELOG.md pnpm-lock.yaml
          git commit -m "chore: release packages"
          git push
          pnpm changeset publish
