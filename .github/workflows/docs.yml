name: Documentation
on:
  push:
    branches: [main]
    paths: ['apps/docs/**', 'packages/i18n/src/**', 'pnpm-lock.yaml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gratise/i18n-docs build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/doc_build
      - id: deployment
        uses: actions/deploy-pages@v5
